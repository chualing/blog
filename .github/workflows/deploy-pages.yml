# 部署到 GitHub Pages
# 触发时机：推送到 master 分支，或手动触发（workflow_dispatch）。
#
# 使用前需在仓库 Settings → Pages 中将 “Build and deployment” 的 Source
# 切换为 “GitHub Actions”（不再直接绑定分支）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，正在运行的会被取消。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build static site
        run: pnpm build
        env:
          # 项目站点（<user>.github.io/<repo>）需设置 basePath；用户主页站留空。
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # 线上站点地址，供 sitemap / robots / canonical 使用。
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
